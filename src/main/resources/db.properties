# ==========================================================
#  数据库配置
#  默认使用 H2 嵌入式数据库：数据文件会生成在 ${dataDir}/gradedb.mv.db，
#  首次启动时自动建表并写入演示数据，无需安装任何数据库即可运行。
#  ${dataDir} 默认是 用户目录/.grade-manager（可用 JVM 参数 -Dgrade.data.dir=... 覆盖）
# ==========================================================
db.driver=org.h2.Driver
db.url=jdbc:h2:file:${dataDir}/gradedb;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
db.username=sa
db.password=

# ---------- 想改用 MySQL 8 时：把上面 4 行注释掉，启用下面 4 行 ----------
# 1）在 MySQL 中执行 src/main/resources/db/schema.sql 与 db/data.sql
# 2）把下面 db.password 改成自己的 root 密码
#db.driver=com.mysql.cj.jdbc.Driver
#db.url=jdbc:mysql://localhost:3306/grade_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
#db.username=root
#db.password=123456

# 是否在启动时自动建表 / 导入演示数据（表已存在则跳过建表，表里已有数据则跳过演示数据）
db.autoInit=true
